name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pwa-nostr-chat/package-lock.json

      - name: Install dependencies
        working-directory: pwa-nostr-chat
        run: npm ci

      - name: Agwallet offline regression tests
        working-directory: pwa-nostr-chat
        run: npm run test:agwallet

      - name: PWA push regression tests
        working-directory: pwa-nostr-chat
        run: npm run test:push

      - name: Notification shortcut tests
        working-directory: pwa-nostr-chat
        run: npm run test:notification-shortcut

      - name: Poker governance regression tests
        working-directory: pwa-nostr-chat
        run: npm run test:poker

      - name: Inline image interoperability tests
        working-directory: pwa-nostr-chat
        run: npm run test:inline-chat-image

      - name: Inline voice interoperability tests
        working-directory: pwa-nostr-chat
        run: npm run test:inline-chat-voice

      - name: Content safety worker tests
        working-directory: pwa-nostr-chat
        run: npm run test:content-filter

      - name: Device sync and private DM regression tests
        working-directory: pwa-nostr-chat
        run: node --experimental-strip-types --test scripts/check-device-sync.mjs scripts/check-private-dm-actions.mjs

      - name: Solar map regression tests
        working-directory: pwa-nostr-chat
        run: npm run test:solar-maps && npm run test:solar-tiles && npm run test:lunar-orientation

      - name: Build
        env:
          VITE_LINK_PREVIEW_URL: ${{ vars.VITE_LINK_PREVIEW_URL }}
        working-directory: pwa-nostr-chat
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa-nostr-chat/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
