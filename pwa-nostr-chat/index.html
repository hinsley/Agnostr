<!doctype html>
<html lang="en" data-theme="phosphor">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0B0C0F" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Agnostr — Ephemeral geohash Bitchat, encrypted DMs, groups, Agmail & Cashu wallet over Nostr"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Agnostr" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Agnostr — Bitchat & Encrypted Messaging over Nostr</title>
    <script>
      ;(function () {
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target
            if (t && t.tagName === 'SCRIPT' && t.type === 'module') {
              var src = t.getAttribute('src') || 'app module'
              window.__AGNOSTR_BOOT_ERR__ = 'Connection failed while loading ' + src
              if (typeof window.__AGNOSTR_SHOW_RECOVERY__ === 'function') {
                window.__AGNOSTR_SHOW_RECOVERY__(window.__AGNOSTR_BOOT_ERR__)
              }
            }
          },
          true
        )
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      ;(function () {
        var shown = false
        function refreshAppCacheOnly(btn) {
          if (btn) {
            btn.disabled = true
            btn.textContent = 'Refreshing cache…'
          }
          var tasks = []
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              tasks.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(
                    regs.map(function (reg) {
                      return reg.unregister()
                    })
                  )
                })
              )
            }
          } catch (_e) {
            /* ignore */
          }
          try {
            if ('caches' in window && window.caches && window.caches.keys) {
              tasks.push(
                window.caches.keys().then(function (keys) {
                  return Promise.all(
                    keys.map(function (key) {
                      return window.caches.delete(key)
                    })
                  )
                })
              )
            }
          } catch (_e) {
            /* ignore */
          }
          Promise.all(tasks).finally(function () {
            window.location.reload()
          })
        }

        function showRecovery(reason) {
          if (shown || window.__AGNOSTR_BOOTED__) return
          var root = document.getElementById('root')
          if (!root || root.childElementCount > 0) return
          shown = true

          var wrap = document.createElement('div')
          wrap.setAttribute('role', 'alert')
          wrap.style.cssText =
            'min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0B0C0F;color:#ECEFF4;font-family:Inter,system-ui,-apple-system,sans-serif;box-sizing:border-box;'

          var card = document.createElement('div')
          card.style.cssText =
            'width:100%;max-width:420px;padding:24px;border-radius:16px;background:#13161C;border:1px solid rgba(255,255,255,0.1);box-shadow:0 18px 48px rgba(0,0,0,0.5);'

          var heading = document.createElement('h1')
          heading.textContent = "Agnostr couldn't finish loading"
          heading.style.cssText =
            'margin:0 0 10px;font-size:18px;font-weight:700;letter-spacing:-0.01em;color:#F8FAFC;'

          var desc = document.createElement('p')
          desc.textContent =
            'A network connection reset or outdated cached update interrupted startup. Your local keys, chats, and wallet remain safe and untouched.'
          desc.style.cssText =
            'margin:0 0 16px;font-size:13.5px;line-height:1.5;color:#9CA3AF;'

          card.appendChild(heading)
          card.appendChild(desc)

          if (reason) {
            var detail = document.createElement('p')
            detail.textContent = String(reason)
            detail.style.cssText =
              'margin:0 0 18px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;line-height:1.4;color:#CBD5E1;word-break:break-word;'
            card.appendChild(detail)
          }

          var actions = document.createElement('div')
          actions.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;'

          var retryBtn = document.createElement('button')
          retryBtn.type = 'button'
          retryBtn.textContent = 'Retry'
          retryBtn.style.cssText =
            'flex:1 1 120px;height:38px;padding:0 16px;border-radius:10px;border:none;background:#22C55E;color:#052E16;font-size:13.5px;font-weight:700;cursor:pointer;'
          retryBtn.addEventListener('click', function () {
            window.location.reload()
          })

          var cacheBtn = document.createElement('button')
          cacheBtn.type = 'button'
          cacheBtn.textContent = 'Refresh App Cache'
          cacheBtn.style.cssText =
            'flex:1 1 160px;height:38px;padding:0 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.16);background:rgba(255,255,255,0.05);color:#F1F5F9;font-size:13.5px;font-weight:600;cursor:pointer;'
          cacheBtn.addEventListener('click', function () {
            refreshAppCacheOnly(cacheBtn)
          })

          actions.appendChild(retryBtn)
          actions.appendChild(cacheBtn)
          card.appendChild(actions)
          wrap.appendChild(card)
          root.appendChild(wrap)
        }

        window.__AGNOSTR_SHOW_RECOVERY__ = showRecovery

        if (window.__AGNOSTR_BOOT_ERR__) {
          window.setTimeout(function () {
            showRecovery(window.__AGNOSTR_BOOT_ERR__)
          }, 500)
        }

        window.setTimeout(function () {
          if (!window.__AGNOSTR_BOOTED__) {
            showRecovery(
              window.__AGNOSTR_BOOT_ERR__ || 'Startup timed out before the app could mount.'
            )
          }
        }, 9000)
      })()
    </script>
  </body>
</html>
