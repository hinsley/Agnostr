<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#1A2438" />
      <stop offset="52%" stop-color="#11141C" />
      <stop offset="100%" stop-color="#0B0C0F" />
    </radialGradient>
    <linearGradient id="beaconGrad" x1="35%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="52%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <radialGradient id="pulseDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DBEAFE" />
      <stop offset="55%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Modern neutral carbon container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)" />
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#60A5FA" stroke-opacity="0.18" stroke-width="3" />

  <!-- Subtle concentric orbital rings -->
  <g stroke="#60A5FA" stroke-opacity="0.1" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="184" />
    <circle cx="256" cy="256" r="124" />
  </g>

  <!-- Signal waves radiating from beacon apex -->
  <g fill="none" stroke="#60A5FA" stroke-linecap="round">
    <path d="M196 138 A86 86 0 0 1 316 138" stroke-width="11" stroke-opacity="0.58" />
    <path d="M164 104 A134 134 0 0 1 348 104" stroke-width="9" stroke-opacity="0.28" />
  </g>

  <!-- Stylized geometric "A" signal beacon -->
  <path
    d="M256 154 L368 388 L322 388 L294 326 L218 326 L190 388 L144 388 Z M256 226 L232 286 L280 286 Z"
    fill="url(#beaconGrad)"
    fill-rule="evenodd"
  />

  <!-- Luminous apex core -->
  <circle cx="256" cy="154" r="34" fill="url(#pulseDot)" opacity="0.7" />
  <circle cx="256" cy="154" r="14" fill="#EFF6FF" />
  <circle cx="256" cy="306" r="7.5" fill="#0B0C0F" />
</svg>
