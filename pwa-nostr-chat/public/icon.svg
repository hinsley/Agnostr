<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#133826" />
      <stop offset="58%" stop-color="#0B1611" />
      <stop offset="100%" stop-color="#070A08" />
    </radialGradient>
    <linearGradient id="beaconGrad" x1="50%" y1="15%" x2="50%" y2="85%">
      <stop offset="0%" stop-color="#5CF5A8" />
      <stop offset="50%" stop-color="#22E584" />
      <stop offset="100%" stop-color="#0EA860" />
    </linearGradient>
    <radialGradient id="pulseDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8FFE0" />
      <stop offset="55%" stop-color="#22E584" />
      <stop offset="100%" stop-color="#22E584" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="#22E584" stroke-opacity="0.22" stroke-width="3" />

  <!-- Subtle geohash graticule -->
  <g stroke="#22E584" stroke-opacity="0.1" stroke-width="2">
    <line x1="256" y1="48" x2="256" y2="464" />
    <line x1="48" y1="256" x2="464" y2="256" />
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="8 10" />
    <circle cx="256" cy="256" r="118" fill="none" />
  </g>

  <!-- Corner tactical reticle ticks -->
  <g stroke="#22E584" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M72 104 V72 H104" />
    <path d="M408 72 H440 V104" />
    <path d="M72 408 V440 H104" />
    <path d="M408 440 H440 V408" />
  </g>

  <!-- Signal waves radiating from beacon apex -->
  <g fill="none" stroke="#22E584" stroke-linecap="round">
    <path d="M196 138 A86 86 0 0 1 316 138" stroke-width="10" stroke-opacity="0.45" />
    <path d="M164 106 A132 132 0 0 1 348 106" stroke-width="8" stroke-opacity="0.24" />
  </g>

  <!-- Stylized geometric "A" transceiver beacon -->
  <path
    d="M256 154 L368 388 L322 388 L294 326 L218 326 L190 388 L144 388 Z M256 226 L232 286 L280 286 Z"
    fill="url(#beaconGrad)"
    fill-rule="evenodd"
  />

  <!-- Center telemetry crossbar glow -->
  <circle cx="256" cy="154" r="34" fill="url(#pulseDot)" opacity="0.65" />
  <circle cx="256" cy="154" r="14" fill="#D4FFEE" />
  <circle cx="256" cy="306" r="8" fill="#070A08" />
</svg>
